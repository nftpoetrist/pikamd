[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "osaka"   # Arc's baseline (docs.arc.io/arc/references/evm-differences)
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

# Official Arc RPCs (ARC.md §2)
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"
